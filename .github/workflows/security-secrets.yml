# =============================================================================
# Security: Secret Scanning
# =============================================================================
# Scans the repository for accidentally committed secrets, API keys, tokens,
# and other sensitive credentials using two complementary tools:
#   - Gitleaks: pattern-based secret detection
#   - TruffleHog: verified secret detection (confirms secrets are live/active)
#
# Runs on every push, on PRs to main/master, and weekly on Sunday at 2 AM UTC.
# =============================================================================

name: "Security: Secret Scanning"

on:
  push:
    branches:
      - "**" # All branches
  pull_request:
    branches:
      - main
      - master
  schedule:
    # Weekly scan: every Sunday at 2:00 AM UTC
    - cron: "0 2 * * 0"

# Minimum permissions required for secret scanning
permissions:
  contents: read
  pull-requests: read

# Prevent duplicate runs for the same branch/PR.
# Cancel in-progress runs when a new commit is pushed.
concurrency:
  group: secret-scanning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Job 1: Gitleaks — Pattern-based secret detection
  # ===========================================================================
  # Gitleaks scans for secrets using regex patterns and entropy analysis.
  # In OSS mode (no license), it scans the current commit on push events
  # and the PR diff on pull_request events.
  # ===========================================================================
  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v4.1.7 — pinned for reproducibility
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        # gitleaks/gitleaks-action v2.3.9 — pinned for reproducibility
        # Works in OSS mode without a license key; set GITLEAKS_LICENSE
        # in repository secrets to enable additional features.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Optional: leave empty for OSS mode

  # ===========================================================================
  # Job 2: TruffleHog — Verified secret detection
  # ===========================================================================
  # TruffleHog goes beyond pattern matching by actually verifying whether
  # detected credentials are live/active against their respective services.
  # The --only-verified flag reduces false positives significantly.
  # ===========================================================================
  trufflehog:
    name: TruffleHog Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v4.1.7 — pinned for reproducibility
        # Full history is required for git-based scanning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          # Install the latest TruffleHog CLI binary
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      - name: Determine scan range
        id: scan-range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PRs: scan only the commits in the PR diff
            echo "args=--since-commit=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "Scanning PR diff: base=${{ github.event.pull_request.base.sha }}"
          else
            # For push/schedule: scan recent commits (--max-depth limits history depth)
            echo "args=--max-depth=50" >> "$GITHUB_OUTPUT"
            echo "Scanning recent commits (max-depth=50)"
          fi

      - name: Run TruffleHog
        run: |
          trufflehog git file://. \
            ${{ steps.scan-range.outputs.args }} \
            --only-verified \
            --fail
